services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: cv-db-dev
    profiles:
      - dev
    environment:
      POSTGRES_DB: ${DATABASE_DEV_NAME:-cv_app_dev}
      POSTGRES_USER: ${DATABASE_DEV_USER:-cv_dev_user}
      POSTGRES_PASSWORD: ${DATABASE_DEV_PASSWORD:-dev_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${DATABASE_DEV_PORT:-5440}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_DEV_USER:-cv_dev_user} -d ${DATABASE_DEV_NAME:-cv_app_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cv-network
    restart: unless-stopped

  postgres-test:
    image: postgres:16-alpine
    container_name: cv-db-test
    profiles:
      - test
    environment:
      POSTGRES_DB: ${DATABASE_TEST_NAME:-cv_app_test}
      POSTGRES_USER: ${DATABASE_TEST_USER:-cv_test_user}
      POSTGRES_PASSWORD: ${DATABASE_TEST_PASSWORD:-test_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${DATABASE_TEST_PORT:-5441}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_TEST_USER:-cv_test_user} -d ${DATABASE_TEST_NAME:-cv_app_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cv-network
    restart: unless-stopped

  postgres-prod:
    image: postgres:16-alpine
    container_name: cv-db-prod
    profiles:
      - prod
    environment:
      POSTGRES_DB: ${DATABASE_PROD_NAME:-cv_app_prod}
      POSTGRES_USER: ${DATABASE_PROD_USER:-cv_prod_user}
      POSTGRES_PASSWORD: ${DATABASE_PROD_PASSWORD:-prod_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "127.0.0.1:${DATABASE_PROD_PORT:-5442}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_PROD_USER:-cv_prod_user} -d ${DATABASE_PROD_NAME:-cv_app_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cv-network
    restart: unless-stopped

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cv-app-dev
    profiles:
      - dev
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      DATABASE_URL: postgresql://${DATABASE_DEV_USER:-cv_dev_user}:${DATABASE_DEV_PASSWORD:-dev_password}@postgres-dev:5432/${DATABASE_DEV_NAME:-cv_app_dev}
      DATABASE_DEV_URL: postgresql://${DATABASE_DEV_USER:-cv_dev_user}:${DATABASE_DEV_PASSWORD:-dev_password}@postgres-dev:5432/${DATABASE_DEV_NAME:-cv_app_dev}
    ports:
      - "${APP_DEV_PORT:-3000}:3000"
    volumes:
      - .:/app
      - app_dev_node_modules:/app/node_modules
      - app_dev_next_cache:/app/.next
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - cv-network
    restart: unless-stopped

  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-app-prod
    profiles:
      - prod
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      DATABASE_URL: postgresql://${DATABASE_PROD_USER:-cv_prod_user}:${DATABASE_PROD_PASSWORD:-prod_password}@postgres-prod:5432/${DATABASE_PROD_NAME:-cv_app_prod}
      DATABASE_PROD_URL: postgresql://${DATABASE_PROD_USER:-cv_prod_user}:${DATABASE_PROD_PASSWORD:-prod_password}@postgres-prod:5432/${DATABASE_PROD_NAME:-cv_app_prod}
    ports:
      - "127.0.0.1:${APP_PROD_PORT:-3001}:3000"
    depends_on:
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - cv-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cv-pgadmin
    profiles:
      - dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cvapp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-dev
    networks:
      - cv-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  postgres_test_data:
    driver: local
  postgres_prod_data:
    driver: local
  pgadmin_data:
    driver: local
  app_dev_node_modules:
    driver: local
  app_dev_next_cache:
    driver: local

networks:
  cv-network:
    driver: bridge
